name: CI Compile Check (Debug)

on:
  push:
    branches:
      - 'a11y/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'agy_ide_bridge/go.mod'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Debug Kotlin & Java
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace
